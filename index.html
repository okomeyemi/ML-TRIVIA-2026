<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>How Well Do You Know Maths League?</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Welcome Screen -->
    <section id="welcomeScreen">

        <img src="images/logo.png" alt="Maths League Logo" class="logo">

        <h1>HOW WELL DO YOU KNOW MATHS LEAGUE?</h1>

        <p>
            Test your knowledge about Maths League and see how well you know our community.
        </p>

        <input
            type="text"
            id="playerName"
            placeholder="Enter your name"
        >

        <button id="startBtn">
            Start Quiz
        </button>

    </section>

    <!-- Quiz Screen -->
    <section id="quizScreen" class="hide">

        <div class="topBar">

            <div id="questionNumber">
                Question 1 / 20
            </div>

            <div id="timer">
                30s
            </div>

        </div>

        <div class="progress">
            <div class="progressFill"></div>
        </div>

        <h2 id="question">
            Question goes here...
        </h2>

        <div id="answers">

            <button class="option"></button>
            <button class="option"></button>
            <button class="option"></button>
            <button class="option"></button>

        </div>

        <button id="nextBtn">
            Next
        </button>

    </section>

    <!-- Result Screen -->
    <section id="resultScreen" class="hide">

        <img src="images/trophy.png" alt="Trophy" class="trophy">

        <h2>Quiz Completed!</h2>

        <h1 id="score">
            18 / 20
        </h1>

        <p id="message">
            Maths League Legend 🏆
        </p>

        <button id="restartBtn">
            Play Again
        </button>

    </section>

    <script src="questions.js"></script>
    <script src="script.js"></script>

</body>
</html>
