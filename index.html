<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ML Trivia 2026</title>

    <link rel="stylesheet" href="css/style.css">

</head>
<body>

    <main class="container">

        <!-- ========= WELCOME SCREEN ========= -->

        <section id="welcome" class="page active">

            <img src="assets/logo.png" alt="Maths League" class="logo">

            <h1>ML TRIVIA 2026</h1>

            <p>
                How Well Do You Know Maths League?
            </p>

            <button id="startBtn">
                START QUIZ
            </button>

        </section>


        <!-- ========= REGISTRATION ========= -->

        <section id="register" class="page">

            <h2>Player Verification</h2>

            <form id="registerForm">

                <div class="inputBox">

                    <label>Registration Number</label>

                    <input
                        type="text"
                        id="regNo"
                        placeholder="ML2026XXXX"
                        required
                    >

                </div>

                <button type="submit">
                    VERIFY
                </button>

            </form>

        </section>


        <!-- ========= QUIZ ========= -->

        <section id="quiz" class="page">

            <div class="quiz-header">

                <span id="questionNumber">
                    Question 1 / 10
                </span>

                <span id="timer">
                    15s
                </span>

            </div>

            <div class="progress">

                <div id="progressBar"></div>

            </div>

            <h2 id="question">

                Question goes here...

            </h2>

            <div id="answers">

                <!-- JavaScript -->

            </div>

            <button id="nextBtn">

                NEXT

            </button>

        </section>


        <!-- ========= RESULT ========= -->

        <section id="result" class="page">

            <h1>Quiz Completed</h1>

            <h2 id="finalScore">
                0 / 10
            </h2>

            <p id="performance">

                Excellent!

            </p>

        </section>

    </main>

    <script src=",js/questions.js"></script>
    <script src="js/script.js"></script>

</body>
</html>
